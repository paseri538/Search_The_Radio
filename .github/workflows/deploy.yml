# さーち・ざ・らじお！ 自動デプロイ
# アップ（push）のたびに sw.js の SW_VERSION を「日付-コミットID」で自動刻印してから公開する。
# ★初回のみ: Settings → Pages → Source を「GitHub Actions」に変更すること
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: sw.js のバージョンを自動刻印
        run: |
          VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          sed -i -E "s/^(const SW_VERSION = ')[^']*(';)/\1${VERSION}\2/" sw.js
          echo "SW_VERSION -> ${VERSION}"
          grep -n "const SW_VERSION" sw.js
          grep -q "const SW_VERSION = '${VERSION}';" sw.js

      - name: Pages 用にまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4
